<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Face Puzzle Fixed</title><style>body{margin:0;background:#111827;color:#fff;font-family:Arial;padding:16px}.wrap{max-width:900px;margin:auto}.card{background:#1f2937;padding:16px;border-radius:16px}button,select{padding:10px 14px;margin:4px;cursor:pointer}video,canvas{width:100%;max-width:500px;border-radius:12px;display:block}#board{position:relative;width:min(90vw,600px);height:min(90vw,600px);background:#222;touch-action:none}.tile{position:absolute;background-size:100% 100%;border:2px solid transparent;box-sizing:border-box}.drag{border-color:#3b82f6}.correct{border-color:#22c55e}</style></head><body><div class=wrap><div class=card><h2>Face Puzzle</h2><p id=msg></p><video id=video autoplay playsinline></video><canvas id=photo hidden></canvas><div><button id=camBtn>Enable Camera</button><button id=snapBtn>Take Photo</button><button id=retakeBtn>Retake</button><select id=grid><option value=3>3×3</option><option value=4>4×4</option><option value=5>5×5</option></select><button id=startBtn>Start Puzzle</button></div><div>⏱ <span id=time>00:00.0</span> | Moves <span id=moves>0</span> | Correct <span id=correct>0</span></div><div id=board></div></div></div><script>
const $=id=>document.getElementById(id);let stream,tiles=[],size=3,mv=0,startInt,startTime;
async function enable(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});video.srcObject=stream;msg.textContent='Camera enabled';}catch(e){msg.textContent='Allow camera and use HTTPS/localhost';}}
camBtn.addEventListener('click',enable);window.addEventListener('load',enable);
snapBtn.onclick=()=>{if(!video.videoWidth)return alert('Camera not ready');photo.width=video.videoWidth;photo.height=video.videoHeight;photo.getContext('2d').drawImage(video,0,0);photo.hidden=false;video.hidden=true};
retakeBtn.onclick=()=>{video.hidden=false;photo.hidden=true};
startBtn.onclick=()=>{if(photo.hidden)return alert('Take photo first');startGame(+grid.value)};
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(n){size=n;board.innerHTML='';tiles=[];mv=0;moves.textContent='0';let order=[...Array(n*n).keys()];shuffle(order);let s=board.clientWidth,cell=s/n;
order.forEach((orig,pos)=>{let c=document.createElement('canvas');c.width=photo.width/n;c.height=photo.height/n;c.getContext('2d').drawImage(photo,(orig%n)*c.width,Math.floor(orig/n)*c.height,c.width,c.height,0,0,c.width,c.height);let d=document.createElement('div');d.className='tile';d.style.width=cell+'px';d.style.height=cell+'px';d.style.backgroundImage=`url(${c.toDataURL()})`;d.dataset.orig=orig;d.dataset.pos=pos;setPos(d,pos,cell);drag(d,cell);board.appendChild(d);tiles.push(d)});startTime=Date.now();clearInterval(startInt);startInt=setInterval(()=>{let s=(Date.now()-startTime)/1000;time.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}.${Math.floor(s*10)%10}`},100)}
function setPos(el,p,c){el.style.left=(p%size)*c+'px';el.style.top=Math.floor(p/size)*c+'px'}
function drag(el,cell){el.addEventListener('pointerdown',()=>el.classList.add('drag'));el.addEventListener('pointerup',e=>{el.classList.remove('drag');let r=board.getBoundingClientRect();let p=Math.floor((e.clientY-r.top)/cell)*size+Math.floor((e.clientX-r.left)/cell);let o=tiles.find(x=>+x.dataset.pos===p);if(o&&o!==el){let t=el.dataset.pos;el.dataset.pos=o.dataset.pos;o.dataset.pos=t;setPos(el,+el.dataset.pos,cell);setPos(o,+o.dataset.pos,cell);mv++;moves.textContent=mv;check();}})}
function check(){let ok=0;tiles.forEach(t=>{let c=+t.dataset.orig===+t.dataset.pos;t.classList.toggle('correct',c);if(c)ok++});correct.textContent=`${ok}/${tiles.length}`;if(ok===tiles.length){clearInterval(startInt);alert('Solved! Time '+time.textContent)}}
</script></body></html>
